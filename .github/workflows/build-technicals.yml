name: Build technical indicators

on:
  workflow_dispatch:
  schedule:
    # Multiple off-minute checks, since GitHub scheduled starts can be delayed.
    # Taiwan 08:43 / 08:53 / 14:15 on weekdays.
    - cron: '43,53 0 * * 1-5'
    - cron: '15 6 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'scripts/build-technicals.mjs'

permissions:
  contents: write

concurrency:
  group: twse-technicals
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build indicators (all eight stocks required)
        id: build
        continue-on-error: true
        run: node scripts/build-technicals.mjs
      - name: Commit verified indicators
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "twse-live-relay-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          snapshot_dir="$(mktemp -d)"
          cp analysis/technicals.json "$snapshot_dir/technicals.json"
          pushed=false
          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            cp "$snapshot_dir/technicals.json" analysis/technicals.json
            git add analysis/technicals.json
            if git diff --cached --quiet; then
              pushed=true
              break
            fi
            git commit -m "analysis: update technical indicators"
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            sleep $((i * 5))
          done
          if [ "$pushed" != true ]; then
            echo "Failed to publish indicator snapshot after 3 attempts"
            exit 1
          fi
      - name: Fail if indicators are incomplete
        if: steps.build.outcome != 'success'
        run: exit 1

name: Build technical indicators

on:
  workflow_dispatch:
  schedule:
    # Taiwan 08:45 daily; report logic still checks whether it is a trading day.
    - cron: '45 0 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/build-technicals.mjs'

permissions:
  contents: write

concurrency:
  group: twse-technicals
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-technicals.mjs
      - name: Commit indicators
        if: always()
        run: |
          git config user.name "twse-live-relay-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/technicals.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "analysis: update technical indicators"
          git pull --rebase origin main
          git push

name: Fetch Taiwan live quotes

on:
  workflow_dispatch:
  # Manual recovery trigger: 2026-10-23 13:00 Asia/Taipei.
  push:
    branches: [main]
    paths-ignore:
      - 'quotes/**'
      - 'analysis/**'
      - 'scripts/fetch-closes.mjs'
      - '.github/workflows/fetch-closes.yml'
      - 'ops/close-refresh-trigger.md'
      - 'scripts/build-technicals.mjs'
      - '.github/workflows/build-technicals.yml'
  schedule:
    # GitHub schedules are best-effort and may be delayed or dropped.
    # Avoid minute 00, which GitHub notes is heavily loaded.
    # Taiwan 09:02-13:32, Monday-Friday; do not poll stale post-close quotes.
    - cron: '2-57/5 1-4 * * 1-5'
    - cron: '2-32/5 5 * * 1-5'
    # Redundant off-minute checks near report deadlines (09:30, 11:00, 13:00).
    - cron: '26,29,31 1 * * 1-5'
    - cron: '54,59 2 * * 1-5'
    - cron: '54,59 4 * * 1-5'

permissions:
  contents: write

concurrency:
  group: twse-live-relay
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Quote regression tests
        run: node --test tests/*.test.mjs
      - name: Fetch TWSE/OTC live quotes
        id: fetch
        continue-on-error: true
        run: node scripts/fetch-quotes.mjs
      - name: Commit latest quote snapshot
        if: ${{ !cancelled() && steps.fetch.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          git config user.name "twse-live-relay-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          snapshot_dir="$(mktemp -d)"
          # A skipped run updates status only, retaining the current remote snapshot.
          if node -e "process.exit(JSON.parse(require('fs').readFileSync('quotes/status.json')).state === 'skipped_outside_session' ? 1 : 0)"; then
            cp quotes/latest.json "$snapshot_dir/latest.json"
          fi
          cp quotes/status.json "$snapshot_dir/status.json"

          pushed=false
          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            # Refuse to overwrite results collected by a newer run.
            if node scripts/should-publish-quotes.mjs "$snapshot_dir/status.json" quotes/status.json; then
              if test -f "$snapshot_dir/latest.json"; then
                cp "$snapshot_dir/latest.json" quotes/latest.json
              fi
            else
              publication_status=$?
              if [ "$publication_status" -ne 1 ]; then
                echo "Cannot safely determine quote publication order"
                exit "$publication_status"
              fi
              echo "A newer quote run is already published"
              pushed=true
              break
            fi
            cp "$snapshot_dir/status.json" quotes/status.json
            git add quotes/latest.json quotes/status.json

            if git diff --cached --quiet; then
              echo "No quote changes"
              pushed=true
              break
            fi

            git commit -m "quotes: update live snapshot"
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            echo "push attempt $i failed; refreshing main and retrying"
            sleep $((i * 5))
          done

          if [ "$pushed" != true ]; then
            echo "Failed to publish quote snapshot after 3 attempts"
            exit 1
          fi
      - name: Fail run if quote fetch failed
        if: steps.fetch.outcome != 'success'
        run: exit 1

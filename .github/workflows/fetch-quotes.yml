name: Fetch Taiwan live quotes

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # GitHub cron is best-effort. Run every 5 minutes during the TWSE/TPEx
    # session window (UTC 01:00-05:59 = Taipei 09:00-13:59), weekdays.
    # The script/report layer still validates trading_date and freshness.
    - cron: '*/5 1-5 * * 1-5'

permissions:
  contents: write

concurrency:
  group: twse-live-relay
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch TWSE/OTC live quotes
        id: fetch
        continue-on-error: true
        run: node scripts/fetch-quotes.mjs
      - name: Commit latest quote snapshot
        if: always()
        run: |
          set -euo pipefail
          git config user.name "twse-live-relay-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          snapshot_dir="$(mktemp -d)"
          cp quotes/latest.json "$snapshot_dir/latest.json"
          cp quotes/status.json "$snapshot_dir/status.json"

          pushed=false
          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            cp "$snapshot_dir/latest.json" quotes/latest.json
            cp "$snapshot_dir/status.json" quotes/status.json
            git add quotes/latest.json quotes/status.json

            if git diff --cached --quiet; then
              echo "No quote changes"
              pushed=true
              break
            fi

            git commit -m "quotes: update live snapshot"
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            echo "push attempt $i failed; refreshing main and retrying"
            sleep $((i * 5))
          done

          if [ "$pushed" != true ]; then
            echo "Failed to publish quote snapshot after 3 attempts"
            exit 1
          fi
      - name: Fail run if quote fetch failed
        if: steps.fetch.outcome != 'success'
        run: exit 1
